name: Governance integrity

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  immutable-controls:
    name: immutable-controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject control-plane changes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const protectedPaths = new Set([
              ".github/CODEOWNERS",
              ".github/workflows/governance-integrity.yml",
              ".github/workflows/python-app.yml",
              "RELEASE_GOVERNANCE.md",
              "scripts/validate_release.py",
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changedControls = files
              .map((file) => file.filename)
              .filter((filename) => protectedPaths.has(filename));
            if (changedControls.length) {
              core.setFailed(
                "Protected release controls changed: " + changedControls.join(", ") +
                ". Use an explicitly authorized governance re-bootstrap."
              );
            }
