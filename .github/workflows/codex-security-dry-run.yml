name: Codex Security configuration check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/codex-security-dry-run.yml"
      - "SECURITY.md"

permissions:
  contents: read

jobs:
  validate-codex-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up the Ubuntu sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Codex Security configuration
        uses: openai/codex-security@eb73cc0fa64f25f432bace6f8ff3f475038bfc71
        with:
          dry-run: "true"
          scope: repository
          model: gpt-5.6-sol
          effort: high
