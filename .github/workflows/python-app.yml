name: Diagnostic engine CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Syntax and undefined-name checks
        run: flake8 diagnostic streamlit_app.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Required regression tests
        run: python -m pytest -q
