name: Governed release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install controlled dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate release controls
        run: python -m scripts.validate_release
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Check syntax and code quality
        run: |
          python -m compileall -q diagnostic streamlit_app.py scripts tests
          flake8 diagnostic streamlit_app.py scripts tests --count --select=E9,F401,F63,F7,F82,F811 --show-source --statistics
      - name: Run required regression suite
        run: python -m pytest -q
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
